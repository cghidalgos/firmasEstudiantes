{% extends 'base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h4 mb-2">Iniciar sesión</h1>
          <p class="text-body-secondary mb-4">Acceso de administración.</p>

          <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input id="username" class="form-control" name="username" type="text" placeholder="admin" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input id="password" class="form-control" name="password" type="password" placeholder="admin" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
          </form>

          <div class="text-center mt-3">
            <a class="link-secondary" href="{{ url_for('index') }}">Volver al registro</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
